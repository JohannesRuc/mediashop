name: Dependency Graph

# GitHubs Dependency Graph liest bei Maven nur die pom.xml und kennt damit
# die vom Parent-BOM verwalteten Versionen nicht. Diese Action loest den
# vollstaendigen Abhaengigkeitsbaum auf und meldet ihn an GitHub, damit
# Dependabot auch transitive Abhaengigkeiten bewerten kann.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Standard: nur lesen. Mehr Rechte bekommt nur der Job, der sie braucht.
permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Dependency Snapshot an GitHub melden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          settings-file: ''
