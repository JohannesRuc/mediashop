version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    # Nur Alerts, keine automatischen Pull Requests (Trainingsstand soll stabil bleiben)
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  # Haelt die SHA-gepinnten Actions aktuell (Dependabot pflegt Hash und Versionskommentar)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
